services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: kaveri/go-judge-python:1.12.3
    container_name: kaveri-go-judge
    restart: unless-stopped
    privileged: true
    cgroup: host
    shm_size: 256m
    cpus: 2
    mem_limit: 1g
    ports:
      - "127.0.0.1:5050:5050"
    command:
      - -http-addr
      - 0.0.0.0:5050
      - -auth-token
      - "${GO_JUDGE_TOKEN:?GO_JUDGE_TOKEN must be configured}"
      - -parallelism
      - "2"
      - -output-limit
      - "1048576"
      - -copy-out-limit
      - "1048576"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"